# 可复用：Go 项目 CI（格式、静态检查、测试、漏洞、构建）
name: ci-go

on:
  workflow_call:
    inputs:
      working-directory:
        description: Go 模块所在目录
        type: string
        default: "."
      go-version:
        description: Go 版本（默认 stable：始终用最新补丁版，标准库漏洞修复即时生效）
        type: string
        default: stable
      race:
        description: 是否开启 -race
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  go:
    name: Go
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ inputs.go-version }}
          check-latest: true
          cache-dependency-path: ${{ inputs.working-directory }}/go.sum

      - name: gofmt
        run: |
          # 在子目录中 git ls-files 返回的就是相对当前目录的路径
          unformatted=$(git ls-files -z '*.go' | grep -zv '^vendor/' | xargs -0 -r gofmt -l)
          if [ -n "$unformatted" ]; then
            echo "::error::以下文件需要 gofmt："
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@latest ./...

      - name: test
        run: |
          args=(-count=1 -coverprofile=coverage.out)
          if [ "${{ inputs.race }}" = "true" ]; then args+=(-race); fi
          go test "${args[@]}" ./...
          go tool cover -func=coverage.out | tail -1 >> "$GITHUB_STEP_SUMMARY"

      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

      - name: build
        run: CGO_ENABLED=0 go build ./...
