# moon 中央部署流水线（可复用工作流）
#
# 各项目仓库只需一个调用文件（见 README），推送到 main 即自动：
#   1. 在 GitHub 托管机器上用 BuildKit 构建镜像（GHA 层缓存、SBOM、来源证明），推送到 GHCR
#   2. 用 GitHub OIDC 短期令牌调用 moon 上的 moon-deployd：无需任何长期密钥
#   3. moon 校验令牌 → 拉取镜像 → 健康检查 → 失败自动回滚 → 配置 HTTPS 入口
#
# moon-deployd 只接受来自本文件（main 分支）的部署请求。
name: moon-deploy

on:
  workflow_call:
    inputs:
      context:
        description: Docker 构建上下文目录
        type: string
        default: "."
      dockerfile:
        description: Dockerfile 路径（相对仓库根目录）
        type: string
        default: Dockerfile
      compose:
        description: compose 文件路径（相对仓库根目录）
        type: string
        default: compose.yaml
      platforms:
        description: 目标平台
        type: string
        default: linux/amd64
    outputs:
      url:
        description: 线上地址
        value: ${{ jobs.deploy.outputs.url }}

permissions: {}

jobs:
  build:
    name: Build image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.ref.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Normalize image name
        id: name
        run: echo "repo=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ steps.name.outputs.repo }}
          tags: |
            type=sha,format=long
            type=raw,value=latest

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          platforms: ${{ inputs.platforms }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Image reference
        id: ref
        run: |
          image="ghcr.io/${{ steps.name.outputs.repo }}@${{ steps.build.outputs.digest }}"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "### 镜像" >> "$GITHUB_STEP_SUMMARY"
          echo "\`$image\`" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy to moon
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
      id-token: write
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: ${{ inputs.compose }}
          sparse-checkout-cone-mode: false

      - name: Deploy
        id: deploy
        env:
          IMAGE: ${{ needs.build.outputs.image }}
          COMPOSE_PATH: ${{ inputs.compose }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          test -f "$COMPOSE_PATH" || { echo "::error::找不到 $COMPOSE_PATH"; exit 1; }
          oidc=$(curl -fsSL -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=moon-deploy" | jq -r .value)
          echo "::add-mask::$oidc"
          req=$(mktemp)
          jq -n --rawfile compose "$COMPOSE_PATH" --arg image "$IMAGE" \
                --arg user "$GITHUB_ACTOR" --arg token "$REGISTRY_TOKEN" \
                '{image: $image, compose: $compose, registry_user: $user, registry_token: $token}' > "$req"
          curl -sS -N --max-time 900 -X POST https://deploy.moonl.cloud/v1/deploy \
            -H "Authorization: Bearer $oidc" -H "Content-Type: application/json" \
            --data-binary "@$req" | tee deploy.log
          rm -f "$req"
          if ! grep -qx 'MOON_DEPLOY_RESULT=ok' deploy.log; then
            echo "::error title=部署失败::moon 未能完成部署（已自动回滚），原因见上方日志"
            exit 1
          fi
          url=$(sed -n 's/^MOON_DEPLOY_URL=//p' deploy.log | tail -1)
          echo "url=$url" >> "$GITHUB_OUTPUT"
          {
            echo "### 已部署到 moon"
            if [ -n "$url" ]; then echo "地址: $url"; else echo "（未声明公网入口）"; fi
          } >> "$GITHUB_STEP_SUMMARY"
