# 可复用：Node 项目 CI（自动识别 pnpm/npm；存在对应脚本才执行 lint / typecheck / test / build）
name: ci-node

on:
  workflow_call:
    inputs:
      working-directory:
        description: package.json 所在目录
        type: string
        default: "."
      node-version:
        description: Node 版本
        type: string
        default: "24"

permissions:
  contents: read

jobs:
  node:
    name: Node
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v7

      - name: Detect package manager
        id: pm
        run: |
          if [ -f pnpm-lock.yaml ]; then echo "pm=pnpm" >> "$GITHUB_OUTPUT"
          elif [ -f package-lock.json ]; then echo "pm=npm" >> "$GITHUB_OUTPUT"
          else echo "pm=npm-nolock" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node-version }}

      - name: Install
        run: |
          case "${{ steps.pm.outputs.pm }}" in
            pnpm) corepack enable && pnpm install --frozen-lockfile ;;
            npm) npm ci ;;
            *) npm install --no-audit --no-fund ;;
          esac

      - name: Run available checks
        run: |
          run() { if [ "${{ steps.pm.outputs.pm }}" = pnpm ]; then pnpm run "$1"; else npm run "$1"; fi; }
          has() { node -e "process.exit(require('./package.json').scripts?.['$1'] ? 0 : 1)"; }
          ran=0
          for s in lint:check lint type-check typecheck test build; do
            if has "$s"; then
              # lint 脚本若带 --fix 只用于检查（不提交改动）
              echo "::group::$s"; run "$s"; echo "::endgroup::"; ran=$((ran + 1))
              [ "$s" = "lint:check" ] && break
            fi
          done
          echo "执行了 $ran 项检查" >> "$GITHUB_STEP_SUMMARY"

      - name: Node built-in tests
        run: |
          shopt -s nullglob
          files=(tests/*.test.mjs test/*.test.mjs)
          if [ ${#files[@]} -gt 0 ] && ! node -e "process.exit(require('./package.json').scripts?.test ? 0 : 1)"; then
            node --test "${files[@]}"
          fi
