# 可复用：Python 项目 CI（ruff 检查；存在测试时运行 pytest）
name: ci-python

on:
  workflow_call:
    inputs:
      working-directory:
        description: 项目目录
        type: string
        default: "."
      python-version:
        type: string
        default: "3.12"

permissions:
  contents: read

jobs:
  python:
    name: Python
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ inputs.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip ruff pytest
          if [ -f pyproject.toml ]; then pip install -e . || pip install .; fi
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi

      - name: ruff
        run: ruff check --output-format=github .

      - name: pytest
        run: |
          if ls tests/ test/ 2>/dev/null | grep -q . || compgen -G "**/test_*.py" >/dev/null; then pytest -q; else echo "没有测试，跳过"; fi
