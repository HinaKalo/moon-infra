<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Moon Console</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%234f46e5'/%3E%3Cpath d='M20.5 7.5a9 9 0 1 0 4 15.2A10 10 0 0 1 20.5 7.5z' fill='white'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/app.css">
</head>
<body>
<div class="shell">
  <aside class="sidebar">
    <div class="brand">
      <svg viewBox="0 0 32 32" class="logo"><rect width="32" height="32" rx="8"/><path d="M20.5 7.5a9 9 0 1 0 4 15.2A10 10 0 0 1 20.5 7.5z"/></svg>
      <div><div class="brand-name">Moon Console</div><div class="brand-host" id="host-name">moon</div></div>
    </div>
    <nav id="nav">
      <a href="#/overview" data-view="overview"><svg viewBox="0 0 24 24"><path d="M3 13h8V3H3zm0 8h8v-6H3zm10 0h8V11h-8zm0-18v6h8V3z"/></svg>概览</a>
      <a href="#/containers" data-view="containers"><svg viewBox="0 0 24 24"><path d="M21 7.5 12 2 3 7.5v9L12 22l9-5.5zM12 4.3l6.4 3.9L12 12 5.6 8.2zM5 9.9l6 3.6v6.1l-6-3.6zm8 9.7v-6.1l6-3.6v6.1z"/></svg>容器</a>
      <a href="#/services" data-view="services"><svg viewBox="0 0 24 24"><path d="M4 4h16v6H4zm0 10h16v6H4zm3-7.5a1.5 1.5 0 1 0 0 .01zm0 10a1.5 1.5 0 1 0 0 .01z"/></svg>宿主服务</a>
      <a href="#/projects" data-view="projects"><svg viewBox="0 0 24 24"><path d="M10 4H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-8z"/></svg>部署项目</a>
      <a href="#/databases" data-view="databases"><svg viewBox="0 0 24 24"><path d="M12 2C7 2 4 3.8 4 5.5v13C4 20.2 7 22 12 22s8-1.8 8-3.5v-13C20 3.8 17 2 12 2zm0 2c3.9 0 6 1.2 6 1.5S15.9 7 12 7 6 5.8 6 5.5 8.1 4 12 4zm6 14.4c-.4.5-2.6 1.6-6 1.6s-5.6-1.1-6-1.6v-2.6c1.5.8 3.7 1.2 6 1.2s4.5-.4 6-1.2zm0-5c-.4.5-2.6 1.6-6 1.6s-5.6-1.1-6-1.6V8.8C7.5 9.6 9.7 10 12 10s4.5-.4 6-1.2z"/></svg>数据库</a>
      <a href="#/disk" data-view="disk"><svg viewBox="0 0 24 24"><path d="M6 2h12a2 2 0 0 1 2 2v16a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2zm6 4a5 5 0 1 0 0 10 5 5 0 0 0 0-10zm0 3.5a1.5 1.5 0 1 1 0 3 1.5 1.5 0 0 1 0-3zM7 18.5a1 1 0 1 0 0 .01z"/></svg>磁盘</a>
    </nav>
    <div class="sidebar-foot">
      <div class="user"><div class="avatar" id="avatar">?</div><div><div id="user-name">—</div><div class="muted small">管理员</div></div></div>
      <button class="btn ghost small" id="logout">退出</button>
    </div>
  </aside>
  <main>
    <header class="topbar">
      <h1 id="title">概览</h1>
      <div class="topbar-right"><span class="live" id="live"><i></i>实时</span><span class="muted small" id="updated"></span></div>
    </header>
    <section id="view" class="view"></section>
  </main>
</div>

<aside class="drawer" id="drawer" aria-hidden="true">
  <div class="drawer-head">
    <div><div class="drawer-title" id="drawer-title">日志</div><div class="muted small" id="drawer-sub"></div></div>
    <div class="drawer-actions">
      <label class="switch"><input type="checkbox" id="follow" checked><span>实时跟随</span></label>
      <input type="search" id="log-filter" placeholder="过滤…">
      <button class="btn ghost small" id="drawer-close">关闭</button>
    </div>
  </div>
  <pre class="logs" id="logs"></pre>
</aside>

<dialog id="confirm">
  <form method="dialog">
    <h3 id="confirm-title">确认操作</h3>
    <p id="confirm-text"></p>
    <div class="dialog-actions"><button value="cancel" class="btn ghost">取消</button><button value="ok" class="btn danger" id="confirm-ok">确认</button></div>
  </form>
</dialog>
<div class="toasts" id="toasts"></div>
<script src="/app.js"></script>
</body>
</html>
